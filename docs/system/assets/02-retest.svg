<path d="M 380 309 L 345 309 L 345 400 L 310 400" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/><text x="353" y="348.5" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">判定</text>
<path d="M 760 309 L 795 309 L 795 400 L 830 400" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/><text x="803" y="348.5" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">判定</text>
<path d="M 310 488 L 310 560" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/><text x="318" y="518" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">是</text>
<path d="M 830 474 L 830 560" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/><text x="838" y="511" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">溯源</text>
<path d="M 640 437 L 600 437 L 600 597 L 540 597" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/><text x="608" y="511" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">后续加重→转入停止</text>
<text x="580" y="30" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="bold" fill="#1F4E79">复测闭环：义务 vs 记录分离 · 加重四口径</text></svg>