<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 445 50 H 695 A 25 25 0 0 1 695 100 H 445 A 25 25 0 0 1 445 50 Z" fill="#2E75B6" stroke="#2E75B6" stroke-width="1.5"/>
<text x="570" y="80" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#FFFFFF">一条处理完成（trial record）</text>
<path d="M 140 150 H 520 V 224 H 140 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="330" y="175" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">复测义务（还欠什么）</text><text x="330" y="192" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">键 = retest:{sessionId}:r{revision}:{kind}:{target}:{side}:{episode}</text><text x="330" y="209" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">五态 pending/completed/deferred/cancelled/superseded</text>
<path d="M 620 150 H 1000 V 224 H 620 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="810" y="175" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">复测记录（实际测到什么）</text><text x="810" y="192" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">只追加 · 作废不删档（superseded 双向引用）</text><text x="810" y="209" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">retestRecordId = 结果:义务:时间戳</text>
<path d="M 380 280 H 760 V 338 H 380 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="570" y="297" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">聚合判定</text><text x="570" y="314" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">任一 worse→worse ｜ 全 better→better</text><text x="570" y="331" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">含 better/partial→partial ｜ 否则 same</text>
<path d="M 310 400 L 540 444 L 310 488 L 80 444 Z" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.5"/>
<text x="310" y="423.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">命中任一“加重”口径？</text><text x="310" y="440.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">①即时：分数升即 worse（无容差）</text><text x="310" y="457.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">②跨会话：升&gt;1 分 ｜ ③complete→unable</text><text x="310" y="474.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">④批量：分降+范围差→activityWorsened</text>
<path d="M 640 400 H 1020 V 474 H 640 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="830" y="425" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">继续既有方案</text><text x="830" y="442" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">improved/partial/same</text><text x="830" y="459" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">retest-only 不增序号但观察入序列</text>
<path d="M 80 560 H 540 V 634 H 80 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="310" y="585" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">停止当前处理（旧方案锁定）</text><text x="310" y="602" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">退阶一次 → ≤3 项聚焦复查（独立评估版本）</text><text x="310" y="619" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">神经/无力或持续≥7 → 转介</text>
<path d="M 640 560 H 1020 V 634 H 640 Z" fill="#EDEDED" stroke="#999999" stroke-width="1.5"/>
<text x="830" y="585" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#444444">decision-trace 证据链</text><text x="830" y="602" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#444444">findingIds · ruleIds · sourceCaseIds</text><text x="830" y="619" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#444444">knowledgeVersion 双轨</text>
