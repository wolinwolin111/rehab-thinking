<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="620" viewBox="0 0 1150 620"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 425 50 H 715 A 25 25 0 0 1 715 100 H 425 A 25 25 0 0 1 425 50 Z" fill="#2E75B6" stroke="#2E75B6" stroke-width="1.5"/>
<text x="570" y="80" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#FFFFFF">双侧主诉（左右同时保留）</text>
<path d="M 60 150 H 500 V 224 H 60 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="280" y="175" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">优先侧裁决（必选）</text><text x="280" y="192" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">安全 ＞ 主诉 ＞ 评估</text><text x="280" y="209" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">评估更差侧只能提醒，不能静默替换</text>
<path d="M 640 150 H 1080 V 224 H 640 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="860" y="175" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">双侧评估完整收集</text><text x="860" y="192" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">每个项目左右分别记录</text><text x="860" y="209" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">缺一不可（完整性门）</text>
<path d="M 60 280 H 500 V 354 H 60 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="280" y="305" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">同一处理目标 → 合并一张双侧卡</text><text x="280" y="322" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">先做优先侧，另一侧随后</text><text x="280" y="339" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">不强迫没有问题的一侧重复处理</text>
<path d="M 640 280 H 1080 V 354 H 640 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="860" y="313.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">双侧复测：同一张卡内分别记录左右</text><text x="860" y="330.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">不生成单侧数字对比</text>
<path d="M 560 420 L 840 453 L 560 486 L 280 453 Z" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.5"/>
<text x="560" y="449.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">任一侧加重？</text><text x="560" y="466.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">双侧评估未完成 → low-load 训练 · 安全信号/处理加重 → blocked</text>
<path d="M 100 540 H 500 V 596 H 100 Z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<text x="300" y="564.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#1F1F1F">停止同类处理</text><text x="300" y="581.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#1F1F1F">双侧动作一侧加重即停</text>
<path d="M 648 540 H 992 A 28 28 0 0 1 992 596 H 648 A 28 28 0 0 1 648 540 Z" fill="#548235" stroke="#548235" stroke-width="1.5"/>
<text x="820" y="564.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#FFFFFF">双侧一致 → 正常进阶</text><text x="820" y="581.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="normal" fill="#FFFFFF">单侧完成后出口必须用户选择，不自动跳侧</text>
<path d="M 400 75 L 340 75 L 340 150 L 280 150" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/><text x="348" y="106.5" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">先定优先侧</text>
<path d="M 740 75 L 800 75 L 800 150 L 860 150" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/><text x="808" y="106.5" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">完整收集</text>
<path d="M 280 224 L 280 280" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/>
<path d="M 860 224 L 860 280" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/>
<path d="M 500 317 L 570 317 L 570 317 L 640 317" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/><text x="578" y="311" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">同一目标</text>
<path d="M 860 354 L 860 387 L 560 387 L 560 420" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/><text x="710" y="381" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">结果</text>
<path d="M 280 354 L 280 354 L 280 453 L 280 453" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<path d="M 280 453 L 290 453 L 290 540 L 300 540" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/><text x="298" y="490.5" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">是</text>
<path d="M 840 453 L 830 453 L 830 540 L 820 540" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arr)"/><text x="838" y="490.5" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#B45309">否</text>
<text x="575" y="30" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="bold" fill="#1F4E79">双侧流程（SYS-BILATERAL-001~004）</text></svg>