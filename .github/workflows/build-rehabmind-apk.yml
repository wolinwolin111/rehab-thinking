name: Build RehabMind Android APK

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: "Release APK 使用的正式 HTTPS 地址；留空使用工程默认值"
        required: false
        type: string
  push:
    paths:
      - "mobile/rehabmind-mobile/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/rehabmind-mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rehabmind-debug-apk
          path: mobile/rehabmind-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build unsigned release candidate
        shell: bash
        run: |
          if [ -n "${{ inputs.release_url }}" ]; then
            gradle :app:assembleRelease --stacktrace -PrehabmindReleaseUrl="${{ inputs.release_url }}"
          else
            gradle :app:assembleRelease --stacktrace
          fi
      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: rehabmind-release-candidate-unsigned
          path: mobile/rehabmind-mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
